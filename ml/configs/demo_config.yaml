# Demo configuration for quick training on sample data

model:
  type: "standard"  # or "lightweight"
  num_classes: 30  # 10 signs per language * 3 languages
  hidden_dim: 128  # Smaller for faster training
  num_lstm_layers: 1
  dropout: 0.3

data:
  train_dir: "../sample_data/train"
  val_dir: "../sample_data/val"
  sequence_length: 30
  num_keypoints: 543

training:
  epochs: 5  # Quick demo training
  batch_size: 4
  learning_rate: 0.001
  weight_decay: 0.01
  min_lr: 0.000001
  num_workers: 2
  use_amp: false  # Disable for CPU training
  save_freq: 2  # Save every 2 epochs

optimizer:
  type: "adamw"
  betas: [0.9, 0.999]
  eps: 0.00000001

scheduler:
  type: "cosine"
  warmup_epochs: 0
